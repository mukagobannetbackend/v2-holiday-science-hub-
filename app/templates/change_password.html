{% extends 'base.html' %}{% block title %}Change password · Holiday Coaching Hub{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h1>Choose a new password.</h1>
    <p>Your temporary password must be replaced before you continue.</p>
    <form method="post">
        <label>New password<input name="password" type="password" minlength="8" required></label>
        <label>Confirm password<input name="confirm" type="password" minlength="8" required></label>
        <button class="btn primary wide">Save password</button></form></div></div>{% endblock %}
